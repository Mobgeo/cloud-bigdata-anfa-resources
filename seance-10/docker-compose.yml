
services:
  mlflow:
    image: python:3.11
    container_name: anfa-mlflow
    restart: unless-stopped
    working_dir: /mlflow
    ports:
      - "5000:5000"  
    volumes:
      - mlflow-data:/mlflow
    command: >
      bash -c "
      pip install --upgrade mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      "

volumes:
  mlflow-data:
